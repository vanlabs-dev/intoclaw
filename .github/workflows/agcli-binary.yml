name: Build agcli binaries

on:
  workflow_dispatch:
    inputs:
      agcli_ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"
  schedule:
    - cron: "0 0 * * 0" # Sunday at 00:00 UTC

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout agcli
        uses: actions/checkout@v4
        with:
          repository: unarbos/agcli
          ref: ${{ inputs.agcli_ref || 'main' }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get agcli version
        id: version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get source commit SHA
        id: commit
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/agcli agcli-${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agcli-${{ matrix.suffix }}
          path: agcli-${{ matrix.suffix }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mv artifacts/agcli-linux-amd64/agcli-linux-amd64 .
          chmod +x agcli-linux-amd64

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agcli-binaries
          name: "agcli pre-built binaries"
          body: |
            Pre-built agcli binaries for use with IntoClaw.

            **Version:** ${{ needs.build.outputs.version }}
            **Source commit:** unarbos/agcli@${{ needs.build.outputs.sha }}
            **Built:** ${{ github.event.repository.updated_at || github.event.head_commit.timestamp || 'scheduled' }}

            Source: https://github.com/unarbos/agcli

            This is a stopgap release. Once agcli publishes its own binaries, these will be removed.
          files: |
            agcli-linux-amd64
          make_latest: false
          prerelease: true
